name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow

    - name: Verify imports and syntax
      run: |
        python -m py_compile src/unzfs.py branding/pyinstaller_icon_hook.py scripts/generate_version_info.py

    - name: Generate Windows version metadata
      run: |
        python scripts/generate_version_info.py --version "${{ github.ref_name }}" --output branding/version_info.txt

    - name: Build Windows executable
      run: |
        python -m PyInstaller --noconfirm --clean ZFSSpecialist.spec
        Get-Item dist/BZZFSSpecialist.exe

    - name: Package Windows application
      run: |
        Compress-Archive -Path dist/BZZFSSpecialist.exe -DestinationPath "Battlezone98Redux_ZFSSpecialist-${{ github.ref_name }}-windows.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Battlezone98Redux_ZFSSpecialist-windows
        path: Battlezone98Redux_ZFSSpecialist-${{ github.ref_name }}-windows.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts

    - name: List artifacts
      run: |
        echo "Artifacts downloaded:"
        find release-artifacts -type f -maxdepth 3 -print

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-artifacts/Battlezone98Redux_ZFSSpecialist-windows/Battlezone98Redux_ZFSSpecialist-v*-windows.zip
        fail_on_unmatched_files: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
