name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow

    - name: Verify imports and syntax
      run: |
        python -m py_compile src/unzfs.py branding/pyinstaller_icon_hook.py
        python -c "import ast; ast.parse(open('src/unzfs.py').read()); print('Import successful')"

    - name: Build Windows executable
      run: |
        python -m PyInstaller --noconfirm --clean ZFSSpecialist.spec
        Get-Item dist/zfs_specialist.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zfs_specialist-windows
        path: dist/zfs_specialist.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      continue-on-error: true

    - name: List artifacts
      run: |
        echo "Artifacts downloaded:"
        find . -type f -name "zfs_specialist*" 2>/dev/null || echo "No artifacts found"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          zfs_specialist-windows/zfs_specialist.exe
        fail_on_unmatched_files: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
